<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة النتائج</title>

  <!-- Bootstrap 5 (نسخة RTL) + خط عربي -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="container">
      <h1 class="app-title">نظام إدارة النتائج</h1>
      <p class="app-subtitle">أضف الطلاب وبياناتهم، ثم فعّل لجنة الرأفة لمراجعة المتعثرين.</p>
    </div>
  </header>

  <main class="container py-4">
    <div class="row g-4">

      <!-- نموذج الإدخال -->
      <section class="col-lg-5">
        <div class="panel">
          <h2 class="panel-title">بيانات الطالب</h2>

          <div class="mb-3">
            <label for="studentName" class="form-label">اسم الطالب</label>
            <input type="text" id="studentName" class="form-control" placeholder=" مثال: سيليا محمد" autocomplete="off">
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12 col-sm-4">
              <label for="grade1" class="form-label">درجة المادة الأولى</label>
              <input type="number" id="grade1" class="form-control" min="0" max="100" step="any" placeholder="0 – 100">
            </div>
            <div class="col-12 col-sm-4">
              <label for="grade2" class="form-label">درجة المادة الثانية</label>
              <input type="number" id="grade2" class="form-control" min="0" max="100" step="any" placeholder="0 – 100">
            </div>
            <div class="col-12 col-sm-4">
              <label for="grade3" class="form-label">درجة المادة الثالثة</label>
              <input type="number" id="grade3" class="form-control" min="0" max="100" step="any" placeholder="0 – 100">
            </div>
          </div>

          <div class="mb-4">
            <label for="attendance" class="form-label">نسبة الحضور (%)</label>
            <input type="number" id="attendance" class="form-control" min="0" max="100" step="any" placeholder="0 – 100">
          </div>

          <!-- صندوق الأخطاء: فارغ في البداية ويظهر فقط عند وجود رسالة -->
          <div id="errorBox" class="error-box" role="alert" aria-live="polite"></div>

          <div class="d-grid gap-2 d-sm-flex">
            <button type="button" id="addStudentBtn" class="btn btn-primary flex-sm-fill">إضافة طالب</button>
            <button type="button" id="mercyBtn" class="btn btn-mercy flex-sm-fill">تفعيل لجنة الرأفة</button>
          </div>
        </div>
      </section>

      <!-- العرض -->
      <section class="col-lg-7">
        <div class="panel mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="panel-title mb-0">قائمة الطلاب</h2>
            <span id="studentsCount" class="count-badge">0</span>
          </div>
          <ul id="studentsListView" class="students-list">
            <li class="empty-note">لم تتم إضافة أي طالب بعد.</li>
          </ul>
        </div>

        <div class="panel">
          <h2 class="panel-title">تقرير لجنة الرأفة</h2>
          <div id="reportArea" class="report-area">
            <p class="empty-note mb-0">اضغط «تفعيل لجنة الرأفة» لعرض التقرير هنا.</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
